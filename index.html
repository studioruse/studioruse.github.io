<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Ruse — Illustration Studio, Coming Soon</title>
<meta name="description" content="Studio Ruse. An illustration studio. Something is taking shape.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #0a0606;
    --ink: #170f10;
    --red: #b31d2e;
    --red-dim: #5c1118;
    --paper: #ece2dd;
    --muted: #8a6b68;
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }

  html, body{ height: 100%; background: var(--black); }

  body{
    font-family: 'Space Grotesk', sans-serif;
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* subtle grain texture for depth */
  .grain{
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.05;
    mix-blend-mode: overlay;
    z-index: 2;
  }

  /* soft red vignette glow from the center */
  .glow{
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 60% 45% at 50% 40%, rgba(179,29,46,0.16), transparent 70%);
    pointer-events: none;
    z-index: 1;
  }

  main{
    position: relative;
    z-index: 3;
    text-align: center;
    padding: 32px;
    max-width: 640px;
  }

  /* the hand-drawn hero flourish */
  .flourish{
    width: min(70vw, 300px);
    height: auto;
    margin: 0 auto 8px;
    display: block;
    overflow: visible;
  }

  .flourish path{
    fill: none;
    stroke: var(--red);
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    pathLength: 1;
    animation: draw-line 1.8s cubic-bezier(0.65,0,0.35,1) 0.2s forwards;
  }

  h1{
    font-family: 'Bodoni Moda', serif;
    font-weight: 500;
    font-size: clamp(4rem, 15vw, 8rem);
    letter-spacing: 0.02em;
    line-height: 0.9;
    color: var(--paper);
    opacity: 0;
    margin-top: 6px;
    animation: rise 1s ease-out 1.6s forwards;
  }

  .kicker{
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    color: var(--muted);
    font-weight: 400;
    margin-top: 14px;
    opacity: 0;
    animation: rise 0.9s ease-out 2s forwards;
  }

  .tagline{
    font-family: 'Bodoni Moda', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1.05rem, 2.6vw, 1.35rem);
    color: var(--paper);
    line-height: 1.55;
    max-width: 440px;
    margin: 20px auto 0;
    opacity: 0;
    animation: rise 0.9s ease-out 2.3s forwards;
  }

  .status{
    margin-top: 34px;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: var(--red);
    opacity: 0;
    animation: rise 0.9s ease-out 2.6s forwards;
  }

  footer{
    position: fixed;
    bottom: 28px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 3;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    opacity: 0;
    animation: rise 0.9s ease-out 2.85s forwards;
  }

  footer a{
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid var(--red-dim);
    padding-bottom: 1px;
    transition: color 0.25s ease, border-color 0.25s ease;
  }

  footer a:hover, footer a:focus-visible{
    color: var(--paper);
    border-color: var(--red);
  }

  a:focus-visible{ outline: 1px solid var(--red); outline-offset: 4px; }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @keyframes draw-line{
    to{ stroke-dashoffset: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .flourish path, h1, .kicker, .tagline, .status, footer{
      animation: none !important;
      opacity: 1 !important;
    }
    .flourish path{ stroke-dashoffset: 0; }
  }
</style>
</head>
<body>

  <svg class="grain" width="100%" height="100%">
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence>
    </filter>
    <rect width="100%" height="100%" filter="url(#noise)"></rect>
  </svg>
  <div class="glow"></div>

  <main>
    <svg class="flourish" viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path pathLength="1" d="M18,95 C34,42 82,18 124,48 C154,70 128,104 96,92 C66,80 78,40 118,32 C168,22 232,40 258,82 C272,104 254,122 224,116 C200,111 206,88 226,80 C246,72 268,80 278,98" />
    </svg>

    <h1>Ruse</h1>
    <p class="kicker">an illustration studio</p>
    <p class="tagline">Every ruse starts as a single line — ink first, meaning later. We're still drawing this one out.</p>
    <p class="status">arriving soon</p>
  </main>

  <footer>
    <a href="mailto:hello@studioruse.in">hello@studioruse.in</a>
  </footer>

</body>
</html>
